<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveCut — offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0e0e0e;
        color: #e8e8e8;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 { font-size: 20px; margin: 0 0 8px; color: #f05a00; }
      p { margin: 0 0 20px; max-width: 380px; color: #aaa; }
      button {
        font: inherit;
        padding: 9px 20px;
        border: 1px solid #f05a00;
        border-radius: 6px;
        background: #f05a00;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #d44e00; border-color: #d44e00; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Couldn't reach LiveCut</h1>
      <p>
        LiveCut loads its interface from the web. Check your internet connection
        and try again.
      </p>
      <button id="retry" type="button">Retry</button>
    </div>
    <script>
      document.getElementById('retry').addEventListener('click', function () {
        location.href = 'https://chrissabato.github.io/livecut/'
      })
    </script>
  </body>
</html>
